<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="128" height="128" fill="url(#gradient1)" rx="24"/>
  
  <!-- Code editor icon -->
  <g transform="translate(25, 30)">
    <!-- Editor lines -->
    <line x1="0" y1="5" x2="20" y2="5" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="30" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="25" x2="25" y2="25" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="35" x2="32" y2="35" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="45" x2="18" y2="45" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Wind effect symbol at bottom -->
  <g transform="translate(20, 70)" opacity="0.8">
    <path d="M 0 5 Q 10 0 20 5" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 5 15 Q 15 10 25 15" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 25 Q 8 22 16 25" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
